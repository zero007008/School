<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Arcane Academy 3D</title><style>
*{box-sizing:border-box}html,body,#game{margin:0;width:100%;height:100%;overflow:hidden;background:#a9c6d8;font-family:system-ui;touch-action:none}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none;color:white}.brand{position:absolute;top:12px;left:50%;transform:translateX(-50%);text-align:center;padding:9px 17px;background:#1b2c46dd;border:1px solid #f2d89b;border-radius:13px;box-shadow:0 4px 20px #18223866}.brand b{display:block;color:#ffe2a0;letter-spacing:3px;font-size:13px}.brand small{font-size:9px;letter-spacing:2px}#hint{position:absolute;top:76px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#1b2c46bb;border-radius:18px;padding:6px 10px;font-size:11px}#status{position:absolute;top:10px;left:10px;background:#1b2c46bb;padding:6px 9px;border-radius:8px;font-size:10px}#joy{position:absolute;bottom:25px;left:22px;width:124px;height:124px;border:2px solid #fff9;border-radius:50%;background:#1b2c4688;pointer-events:auto;touch-action:none}#stick{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:49px;height:49px;border-radius:50%;background:linear-gradient(145deg,#ffe6a9,#a77946);border:2px solid white}#jump{position:absolute;right:25px;bottom:42px;width:76px;height:76px;border-radius:50%;background:linear-gradient(145deg,#b69be6,#59458e);border:2px solid white;color:white;font-weight:900;pointer-events:auto;touch-action:none}#err{display:none;position:fixed;inset:0;background:#1b2c46;color:white;padding:25px}@media(min-width:800px){#joy{width:140px;height:140px;left:35px;bottom:35px}}
</style></head><body><div id="game"></div><div id="hud"><div class="brand"><b>ARCANE ACADEMY</b><small>THE ENCHANTED SCHOOL</small></div><div id="hint">Explore · Joystick / WASD · Jump</div><div id="status">Loading world…</div><div id="joy"><div id="stick"></div></div><button id="jump">JUMP</button></div><div id="err"><h3>3D world could not load</h3><p>Check internet connection and WebGL support.</p><pre id="errtxt"></pre></div>
<script type="module">
try{
const T=await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js'),host=document.getElementById('game'),status=document.getElementById('status');
const scene=new T.Scene();scene.background=new T.Color(0xa9c6d8);scene.fog=new T.Fog(0xa9c6d8,75,180);
const camera=new T.PerspectiveCamera(58,innerWidth/innerHeight,.1,250);
const renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;host.appendChild(renderer.domElement);
scene.add(new T.HemisphereLight(0xe8f4ff,0x566148,2));const sun=new T.DirectionalLight(0xffe1b0,3.2);sun.position.set(-35,65,30);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-70;sun.shadow.camera.right=70;sun.shadow.camera.top=70;sun.shadow.camera.bottom=-70;scene.add(sun);
const M=(c,r=.88)=>new T.MeshStandardMaterial({color:c,roughness:r}),stone=M(0xb7aa94),cream=M(0xd2c4a9),trim=M(0x81786c),roof=M(0x35465e),roof2=M(0x536d85),wood=M(0x63432e),gold=M(0xe7bf73,.45),glass=M(0x52758b,.25),grass=M(0x698650),pathmat=M(0xc8b38e),dark=M(0x252b39);
function add(g,m,x,y,z,p=scene){const o=new T.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;p.add(o);return o}function B(w,h,d,m,x,y,z,p=scene){return add(new T.BoxGeometry(w,h,d),m,x,y,z,p)}
add(new T.PlaneGeometry(250,250),grass,0,-.1,0).rotation.x=-Math.PI/2;
function tower(x,z,r,h){add(new T.CylinderGeometry(r,r*1.08,h,12),stone,x,h/2,z);add(new T.CylinderGeometry(r*1.12,r*1.12,.55,12),cream,x,h*.75,z);add(new T.ConeGeometry(r*1.42,h*.36,12),roof,x,h+h*.17,z);add(new T.SphereGeometry(.22,10,8),gold,x,h+h*.36,z);for(let i=0;i<4;i++){let a=i*Math.PI/2,wx=x+Math.sin(a)*(r+.04),wz=z+Math.cos(a)*(r+.04);let w=B(.78,2,.16,glass,wx,h*.48,wz);w.rotation.y=a;}}
function wing(x,z,w,d,h){B(w,h,d,stone,x,h/2,z);B(w+.7,.5,d+.7,cream,x,.25,z);for(let px=x-w/2+3;px<x+w/2-1;px+=4){for(let y of [3.4,6.5]){B(1.35,2.2,.2,trim,px,y,z+d/2+.08);B(1.05,1.85,.13,glass,px,y,z+d/2+.16);B(1.2,.13,.16,cream,px,y+1.15,z+d/2+.22);add(new T.SphereGeometry(.55,12,8,0,Math.PI,0,Math.PI/2),cream,px,y+1.05,z+d/2+.18).scale.set(1,.7,.2);}}}
wing(0,-29,25,15,14);wing(-23,-24,20,12,9);wing(23,-24,20,12,9);B(18,7,12,cream,0,3.5,-16);B(7,9,.8,wood,0,4.5,-21);B(8,.5,1,gold,0,9.2,-21);
tower(-13,-33,3.6,20);tower(13,-33,3.6,20);tower(-32,-22,3.1,14);tower(32,-22,3.1,14);tower(-23,-13,2.5,12);tower(23,-13,2.5,12);tower(0,-44,3,25);
for(let x=-30;x<=30;x+=5){B(1.3,1.1,1.3,cream,x,14,-29);}
const road=add(new T.PlaneGeometry(12,66),pathmat,0,.01,17);road.rotation.x=-Math.PI/2;const cross=add(new T.PlaneGeometry(65,8),pathmat,0,.02,-5);cross.rotation.x=-Math.PI/2;
add(new T.CircleGeometry(5.5,32),M(0x6ba8b5,.2),-23,.02,8).rotation.x=-Math.PI/2;
const greens=[M(0x47754a),M(0x5e874f),M(0x789653),M(0x426b48)];function tree(x,z,s=1){add(new T.CylinderGeometry(.23*s,.4*s,2.6*s,7),wood,x,1.3*s,z);for(let i=0;i<3;i++){let c=add(new T.IcosahedronGeometry((1.8-i*.17)*s,1),greens[i%4],x,(2.6+i*.85)*s,z);c.scale.y=1.15;}}
for(const [x,z] of [[-15,8],[-19,14],[15,8],[19,14],[-40,0],[40,0],[-43,19],[43,19],[-14,30],[14,30],[-33,27],[33,27],[-8,17],[8,17]])tree(x,z,.95);
function lamp(x,z){B(.2,3,.2,dark,x,1.5,z);B(.8,.18,.8,gold,x,3,z);add(new T.SphereGeometry(.34,10,8),new T.MeshStandardMaterial({color:0xffd78b,emissive:0xffa52b,emissiveIntensity:1}),x,3.45,z);}lamp(-6,5);lamp(6,5);
for(let i=0;i<30;i++){let x=(Math.random()-.5)*80,z=(Math.random()-.5)*65+9;if(Math.abs(x)>10)add(new T.IcosahedronGeometry(.25+Math.random()*.3,0),greens[i%4],x,.25,z);}
// Low-poly student adventurer
const hero=new T.Group();scene.add(hero);hero.position.set(0,0,25);const robe=M(0x394362),skin=M(0xe7b991),hair=M(0x39291f),boot=M(0x292a32);
add(new T.CylinderGeometry(.42,.68,1.45,7),robe,0,1.15,0,hero);add(new T.ConeGeometry(.73,.85,7),M(0x252e4a),0,1.1,-.22,hero);add(new T.SphereGeometry(.38,14,12),skin,0,2.12,0,hero);add(new T.SphereGeometry(.4,12,8,0,Math.PI*2,0,Math.PI*.58),hair,0,2.29,0,hero);B(.13,.13,.06,dark,-.13,2.14,.34,hero);B(.13,.13,.06,dark,.13,2.14,.34,hero);B(.2,.68,.15,gold,0,1.55,.43,hero);add(new T.ConeGeometry(.42,.75,7),roof,0,2.78,0,hero);add(new T.CylinderGeometry(.42,.42,.08,12),roof,0,2.43,0,hero);
const legs=[];for(let x of [-.24,.24]){legs.push(add(new T.CylinderGeometry(.14,.17,.68,7),boot,x,.43,0,hero));B(.32,.18,.48,boot,x,.12,.1,hero);}
const keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')jump();if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault();});addEventListener('keyup',e=>keys[e.code]=false);
let jx=0,jy=0,pid=null,vy=0;const joy=document.getElementById('joy'),stick=document.getElementById('stick');function joymove(e){let r=joy.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,lim=r.width*.34,len=Math.hypot(dx,dy),k=len>lim?lim/len:1;dx*=k;dy*=k;jx=dx/lim;jy=dy/lim;stick.style.left='calc(50% + '+dx+'px)';stick.style.top='calc(50% + '+dy+'px)';}joy.addEventListener('pointerdown',e=>{pid=e.pointerId;joy.setPointerCapture(pid);joymove(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===pid)joymove(e)});function reset(){pid=null;jx=jy=0;stick.style.left='50%';stick.style.top='50%'}joy.addEventListener('pointerup',reset);joy.addEventListener('pointercancel',reset);function jump(){if(hero.position.y<.02)vy=8.8}document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});
const clock=new T.Clock(),off=new T.Vector3(0,8,14);camera.position.set(0,9,42);let elapsed=0;
function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.04);elapsed+=dt;let x=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+jx,z=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0)+jy,n=Math.hypot(x,z);if(n>1){x/=n;z/=n}let moving=n>.08,speed=keys.ShiftLeft?8:5.3;hero.position.x=T.MathUtils.clamp(hero.position.x+x*speed*dt,-53,53);hero.position.z=T.MathUtils.clamp(hero.position.z+z*speed*dt,-58,53);if(moving)hero.rotation.y=Math.atan2(x,z);vy-=22*dt;hero.position.y=Math.max(0,hero.position.y+vy*dt);if(hero.position.y===0)vy=0;if(moving){legs[0].rotation.x=Math.sin(elapsed*10)*.5;legs[1].rotation.x=-Math.sin(elapsed*10)*.5}else legs.forEach(l=>l.rotation.x=0);camera.position.lerp(new T.Vector3(hero.position.x+off.x,hero.position.y+off.y,hero.position.z+off.z),1-Math.exp(-4*dt));camera.lookAt(hero.position.x,hero.position.y+1.8,hero.position.z);status.textContent='ACADEMY GROUNDS · '+Math.round(hero.position.x)+', '+Math.round(hero.position.z);renderer.render(scene,camera);}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});status.textContent='World ready · Explore';animate();
}catch(e){document.getElementById('err').style.display='block';document.getElementById('errtxt').textContent=String(e);console.error(e)}
</script></body></html>
