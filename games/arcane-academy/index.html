<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Arcane Academy 3D</title><style>
*{box-sizing:border-box}html,body,#game{margin:0;width:100%;height:100%;overflow:hidden;background:#a9c6d8;font-family:system-ui;touch-action:none}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none;color:white}.brand{position:absolute;top:12px;left:50%;transform:translateX(-50%);text-align:center;padding:9px 17px;background:#1b2c46dd;border:1px solid #f2d89b;border-radius:13px;box-shadow:0 4px 20px #18223866}.brand b{display:block;color:#ffe2a0;letter-spacing:3px;font-size:13px}.brand small{font-size:9px;letter-spacing:2px}#hint{position:absolute;top:76px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#1b2c46bb;border-radius:18px;padding:6px 10px;font-size:11px}#status{position:absolute;top:10px;left:10px;background:#1b2c46bb;padding:6px 9px;border-radius:8px;font-size:10px}#joy,#jump{display:none}#err{display:none;position:fixed;inset:0;background:#1b2c46;color:white;padding:25px}@media(min-width:800px){#joy{width:140px;height:140px;left:35px;bottom:35px}}
</style></head><body><div id="game"></div><div id="hud"><div class="brand"><b>ARCANE ACADEMY</b><small>THE ENCHANTED SCHOOL</small></div><div id="hint">45° ISOMETRIC VIEW · Tap / Click to move</div><div id="status">Loading world…</div><div id="joy"><div id="stick"></div></div><button id="jump">JUMP</button></div><div id="err"><h3>3D world could not load</h3><p>Check internet connection and WebGL support.</p><pre id="errtxt"></pre></div>
<script type="module">
try{
const T=await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js'),host=document.getElementById('game'),status=document.getElementById('status');
const scene=new T.Scene();scene.background=new T.Color(0xa9c6d8);scene.fog=new T.Fog(0xa9c6d8,75,180);
const camera=new T.OrthographicCamera(-34,34,22,-22,.1,300);
const renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;host.appendChild(renderer.domElement);
scene.add(new T.HemisphereLight(0xe8f4ff,0x566148,2));const sun=new T.DirectionalLight(0xffe1b0,3.2);sun.position.set(-35,65,30);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-70;sun.shadow.camera.right=70;sun.shadow.camera.top=70;sun.shadow.camera.bottom=-70;scene.add(sun);
const M=(c,r=.88)=>new T.MeshStandardMaterial({color:c,roughness:r}),stone=M(0xb7aa94),cream=M(0xd2c4a9),trim=M(0x81786c),roof=M(0x35465e),roof2=M(0x536d85),wood=M(0x63432e),gold=M(0xe7bf73,.45),glass=M(0x52758b,.25),grass=M(0x698650),pathmat=M(0xc8b38e),dark=M(0x252b39);
function add(g,m,x,y,z,p=scene){const o=new T.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;p.add(o);return o}function B(w,h,d,m,x,y,z,p=scene){return add(new T.BoxGeometry(w,h,d),m,x,y,z,p)}
add(new T.PlaneGeometry(250,250),grass,0,-.1,0).rotation.x=-Math.PI/2;
function tower(x,z,r,h){add(new T.CylinderGeometry(r,r*1.08,h,12),stone,x,h/2,z);add(new T.CylinderGeometry(r*1.12,r*1.12,.55,12),cream,x,h*.75,z);add(new T.ConeGeometry(r*1.42,h*.36,12),roof,x,h+h*.17,z);add(new T.SphereGeometry(.22,10,8),gold,x,h+h*.36,z);for(let i=0;i<4;i++){let a=i*Math.PI/2,wx=x+Math.sin(a)*(r+.04),wz=z+Math.cos(a)*(r+.04);let w=B(.78,2,.16,glass,wx,h*.48,wz);w.rotation.y=a;}}
function wing(x,z,w,d,h){B(w,h,d,stone,x,h/2,z);B(w+.7,.5,d+.7,cream,x,.25,z);for(let px=x-w/2+3;px<x+w/2-1;px+=4){for(let y of [3.4,6.5]){B(1.35,2.2,.2,trim,px,y,z+d/2+.08);B(1.05,1.85,.13,glass,px,y,z+d/2+.16);B(1.2,.13,.16,cream,px,y+1.15,z+d/2+.22);add(new T.SphereGeometry(.55,12,8,0,Math.PI,0,Math.PI/2),cream,px,y+1.05,z+d/2+.18).scale.set(1,.7,.2);}}}
wing(0,-29,25,15,14);wing(-23,-24,20,12,9);wing(23,-24,20,12,9);B(18,7,12,cream,0,3.5,-16);B(7,9,.8,wood,0,4.5,-21);B(8,.5,1,gold,0,9.2,-21);
tower(-13,-33,3.6,20);tower(13,-33,3.6,20);tower(-32,-22,3.1,14);tower(32,-22,3.1,14);tower(-23,-13,2.5,12);tower(23,-13,2.5,12);tower(0,-44,3,25);
for(let x=-30;x<=30;x+=5){B(1.3,1.1,1.3,cream,x,14,-29);}
const road=add(new T.PlaneGeometry(12,66),pathmat,0,.01,17);road.rotation.x=-Math.PI/2;const cross=add(new T.PlaneGeometry(65,8),pathmat,0,.02,-5);cross.rotation.x=-Math.PI/2;
add(new T.CircleGeometry(5.5,32),M(0x6ba8b5,.2),-23,.02,8).rotation.x=-Math.PI/2;
const greens=[M(0x47754a),M(0x5e874f),M(0x789653),M(0x426b48)];function tree(x,z,s=1){add(new T.CylinderGeometry(.23*s,.4*s,2.6*s,7),wood,x,1.3*s,z);for(let i=0;i<3;i++){let c=add(new T.IcosahedronGeometry((1.8-i*.17)*s,1),greens[i%4],x,(2.6+i*.85)*s,z);c.scale.y=1.15;}}
for(const [x,z] of [[-15,8],[-19,14],[15,8],[19,14],[-40,0],[40,0],[-43,19],[43,19],[-14,30],[14,30],[-33,27],[33,27],[-8,17],[8,17]])tree(x,z,.95);
function lamp(x,z){B(.2,3,.2,dark,x,1.5,z);B(.8,.18,.8,gold,x,3,z);add(new T.SphereGeometry(.34,10,8),new T.MeshStandardMaterial({color:0xffd78b,emissive:0xffa52b,emissiveIntensity:1}),x,3.45,z);}lamp(-6,5);lamp(6,5);
for(let i=0;i<30;i++){let x=(Math.random()-.5)*80,z=(Math.random()-.5)*65+9;if(Math.abs(x)>10)add(new T.IcosahedronGeometry(.25+Math.random()*.3,0),greens[i%4],x,.25,z);}
// NUCS student character — modeled from the supplied front/back/side reference
const hero=new T.Group();scene.add(hero);hero.position.set(0,0,25);
const shirt=M(0xf1f3ef),teal=M(0x087f78),skin=M(0xe6b18e),hair=M(0x211d1b),pants=M(0x20232a),shoe=M(0xf4f4ef),sole=M(0xb8c2c4),eye=M(0x171719);
function limb(x,y,z,w,h,d,mat,parent=hero){return B(w,h,d,mat,x,y,z,parent)}
// trousers and shoes
const legs=[];
for(const x of [-.23,.23]){
 const leg=limb(x,.57,0,.29,1.05,.34,pants);legs.push(leg);
 limb(x,.12,.13,.36,.18,.58,shoe);
 limb(x,.035,.13,.37,.055,.59,sole);
}
// white NUCS polo shirt, teal collar and sleeve piping
limb(0,1.55,0,.92,1.05,.48,shirt);
for(const x of [-.59,.59]){
 const sleeve=add(new T.CylinderGeometry(.18,.2,.48,8),shirt,x,1.78,0,hero);sleeve.rotation.z=x<0?-.18:.18;
 const cuff=limb(x,1.55,0,.36,.09,.39,teal);
 const arm=add(new T.CylinderGeometry(.105,.13,.68,8),skin,x*1.04,1.15,.02,hero);arm.rotation.z=x<0?-.08:.08;
 add(new T.SphereGeometry(.13,10,8),skin,x*1.04,.78,.04,hero);
}
// collar, placket and small NUCS chest badge
limb(0,2.04,.255,.34,.12,.045,teal);
limb(0,1.76,.253,.055,.43,.025,teal);
limb(-.27,1.72,.26,.22,.15,.025,teal);
limb(-.27,1.72,.278,.13,.07,.012,gold);
// head, ears and layered dark hair
add(new T.SphereGeometry(.34,16,14),skin,0,2.42,0,hero);
for(const x of [-.34,.34])add(new T.SphereGeometry(.09,10,8),skin,x,2.4,0,hero);
const cap=add(new T.SphereGeometry(.37,16,12,0,Math.PI*2,0,Math.PI*.62),hair,0,2.55,-.035,hero);
cap.scale.set(1.08,.9,1.05);
for(let i=0;i<7;i++){const tuft=add(new T.IcosahedronGeometry(.15,1),hair,-.25+i*.085,2.73+Math.sin(i*1.7)*.08,.08,hero);tuft.scale.set(1.1,.8,.8);}
for(const x of [-.13,.13])add(new T.SphereGeometry(.045,8,8),eye,x,2.43,.31,hero);
limb(0,2.28,.315,.11,.025,.025,hair);
// backpack strap hints
for(const x of [-.31,.31]){const strap=limb(x,1.72,-.22,.09,.62,.07,teal);strap.rotation.z=x<0?-.2:.2;}
const keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(e.code.startsWith('Arrow'))e.preventDefault()});addEventListener('keyup',e=>keys[e.code]=false);
// Click/tap a point on the ground and the student walks there.
const raycaster=new T.Raycaster(),pointer=new T.Vector2(),ground=new T.Plane(new T.Vector3(0,1,0),0),destination=new T.Vector3(0,0,25);let hasDestination=false,elapsed=0;
const marker=new T.Group();scene.add(marker);const ring=add(new T.RingGeometry(.65,.86,32),new T.MeshBasicMaterial({color:0xffdf8a,side:T.DoubleSide}),0,.06,0,marker);ring.rotation.x=-Math.PI/2;const dot=add(new T.CircleGeometry(.18,20),new T.MeshBasicMaterial({color:0xffdf8a}),0,.07,0,marker);dot.rotation.x=-Math.PI/2;marker.visible=false;
function setDestination(e){const r=renderer.domElement.getBoundingClientRect();pointer.x=((e.clientX-r.left)/r.width)*2-1;pointer.y=-((e.clientY-r.top)/r.height)*2+1;raycaster.setFromCamera(pointer,camera);const hit=new T.Vector3();if(raycaster.ray.intersectPlane(ground,hit)){destination.set(T.MathUtils.clamp(hit.x,-53,53),0,T.MathUtils.clamp(hit.z,-58,53));hasDestination=true;marker.position.copy(destination);marker.visible=true;}}
renderer.domElement.addEventListener('pointerdown',e=>{if(e.button===0)setDestination(e)});
const clock=new T.Clock(),camOffset=new T.Vector3(0,42,42);
function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.04);elapsed+=dt;
let dx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),dz=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
let moving=hasDestination||Math.hypot(dx,dz)>.05;
if(hasDestination){dx=destination.x-hero.position.x;dz=destination.z-hero.position.z;let dist=Math.hypot(dx,dz);if(dist<.45){hasDestination=false;marker.visible=false;dx=dz=0}else{dx/=dist;dz/=dist}}
let manual=Math.hypot(dx,dz);if(manual>.05){if(!hasDestination){dx/=manual;dz/=manual}let speed=hasDestination?6.5:6;hero.position.x=T.MathUtils.clamp(hero.position.x+dx*speed*dt,-53,53);hero.position.z=T.MathUtils.clamp(hero.position.z+dz*speed*dt,-58,53);hero.rotation.y=Math.atan2(dx,dz);legs[0].rotation.x=Math.sin(elapsed*10)*.45;legs[1].rotation.x=-Math.sin(elapsed*10)*.45}else legs.forEach(l=>l.rotation.x=0);
marker.rotation.y=elapsed*.7;
const target=new T.Vector3(hero.position.x+camOffset.x,hero.position.y+camOffset.y,hero.position.z+camOffset.z);camera.position.lerp(target,1-Math.exp(-4*dt));camera.lookAt(hero.position.x,0,hero.position.z);
status.textContent=hasDestination?'WALKING TO DESTINATION':'ACADEMY GROUNDS · TAP TO MOVE';renderer.render(scene,camera);}
addEventListener('resize',()=>{const h=22,w=h*(innerWidth/innerHeight);camera.left=-w;camera.right=w;camera.top=h;camera.bottom=-h;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});status.textContent='World ready · Tap to move';animate();
}catch(e){document.getElementById('err').style.display='block';document.getElementById('errtxt').textContent=String(e);console.error(e)}
</script></body></html>
