<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111426">
<title>Arcane Academy — 3D School Adventure</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101426;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}
#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none}
#title{position:absolute;top:14px;left:50%;transform:translateX(-50%);text-align:center;padding:9px 16px;border:1px solid #d8c18b55;border-radius:14px;background:#111426aa;backdrop-filter:blur(8px);white-space:nowrap}
#title strong{display:block;font-size:14px;letter-spacing:2px;color:#f3d99a}#title small{font-size:10px;color:#c8c9d7;letter-spacing:1px}
#hint{position:absolute;top:88px;left:50%;transform:translateX(-50%);font-size:12px;color:#fff9;background:#11142688;padding:7px 11px;border-radius:9px;text-align:center;max-width:90vw}
#joystick{position:absolute;left:24px;bottom:28px;width:122px;height:122px;border:2px solid #ffffff55;border-radius:50%;background:#10142677;pointer-events:auto;touch-action:none}
#stick{position:absolute;left:50%;top:50%;width:48px;height:48px;transform:translate(-50%,-50%);border-radius:50%;background:linear-gradient(145deg,#d8c18b,#947b49);border:2px solid #fff8;box-shadow:0 4px 18px #0007}
#jump{position:absolute;right:26px;bottom:42px;width:76px;height:76px;border:2px solid #ffffff88;border-radius:50%;background:#7357aadd;color:white;font-weight:800;letter-spacing:1px;pointer-events:auto;touch-action:none}
#status{position:absolute;left:12px;top:12px;font-size:11px;color:#ffffffbb;background:#10142688;padding:6px 9px;border-radius:8px}
#error{display:none;position:fixed;inset:0;background:#101426;color:white;padding:24px;z-index:5;overflow:auto}
@media(min-width:800px){#joystick{width:140px;height:140px;left:34px;bottom:34px}#stick{width:54px;height:54px}#jump{right:36px;bottom:48px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
  <div id="title"><strong>ARCANE ACADEMY</strong><small>3D SCHOOL ADVENTURE</small></div>
  <div id="hint">Explore the academy · Move with joystick or WASD · Space to jump</div>
  <div id="status">Loading 3D world…</div>
  <div id="joystick" aria-label="Movement joystick"><div id="stick"></div></div>
  <button id="jump" type="button">JUMP</button>
</div>
<div id="error"><h2>3D world could not start</h2><p>Please open this page with an internet connection and a browser that supports WebGL.</p><p id="errorText"></p></div>
<script type="module">
try {
  const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
  const host = document.getElementById('game');
  const status = document.getElementById('status');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x9ab7d0);
  scene.fog = new THREE.Fog(0x9ab7d0, 45, 145);
  const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.1, 220);
  const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.6));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.12;
  host.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xe3efff, 0x4b563d, 2.0));
  const sun = new THREE.DirectionalLight(0xffe2b0, 3.0);
  sun.position.set(-30, 55, 25); sun.castShadow = true;
  sun.shadow.mapSize.set(1024,1024);
  sun.shadow.camera.left=-55; sun.shadow.camera.right=55; sun.shadow.camera.top=55; sun.shadow.camera.bottom=-55;
  scene.add(sun);

  const mat = (color, roughness=0.9) => new THREE.MeshStandardMaterial({color,roughness});
  const stone = mat(0x777d89), lightStone = mat(0x9ba0a8), roofMat = mat(0x35435a), dark = mat(0x252c3b);
  const grassMat = mat(0x526e49), pathMat = mat(0xb3a58c), wood = mat(0x5b3e2d), gold = mat(0xd8b86e);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(240,240),grassMat);
  ground.rotation.x=-Math.PI/2; ground.position.y=-0.08; ground.receiveShadow=true; scene.add(ground);

  function box(w,h,d,material,x,y,z, parent=scene) {
    const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
    m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; parent.add(m); return m;
  }
  function tower(x,z,r=3,h=13) {
    const body=new THREE.Mesh(new THREE.CylinderGeometry(r,r*1.08,h,12),stone);
    body.position.set(x,h/2,z); body.castShadow=true; body.receiveShadow=true; scene.add(body);
    const top=new THREE.Mesh(new THREE.ConeGeometry(r*1.32, h*0.32, 12),roofMat);
    top.position.set(x,h+h*0.16,z); top.castShadow=true; scene.add(top);
    const finial=new THREE.Mesh(new THREE.SphereGeometry(0.28,8,8),gold);
    finial.position.set(x,h+h*0.32+0.15,z); scene.add(finial);
    for(let yy=3;yy<h-1;yy+=3.2){
      const win=box(0.65,1.5,0.18,dark,x,yy,z-r*0.97);
      win.rotation.z=0.08;
    }
  }
  // Main academy: central hall, wings, towers and tall arched-looking windows.
  box(24,13,13,stone,0,6.5,-24);
  box(16,17,10,lightStone,0,8.5,-31);
  box(34,9,10,stone,-25,4.5,-22);
  box(34,9,10,stone,25,4.5,-22);
  box(13,7,9,lightStone,0,3.5,-14);
  box(7,10,2,wood,0,5,-18.7);
  box(9,0.6,1.1,gold,0,10.2,-18.4);
  for(let x=-27;x<=27;x+=9){
    for(let y=3;y<=9;y+=4){
      box(1.1,2.1,0.22,dark,x,y,-15.42);
    }
  }
  tower(-18,-29,3.4,15); tower(18,-29,3.4,15);
  tower(-33,-18,3,11); tower(33,-18,3,11);
  tower(-9,-38,2.6,19); tower(9,-38,2.6,19);
  // Courtyard paths and garden.
  const path=new THREE.Mesh(new THREE.PlaneGeometry(9,55),pathMat);
  path.rotation.x=-Math.PI/2; path.position.set(0,0.01,7); scene.add(path);
  const cross=new THREE.Mesh(new THREE.PlaneGeometry(48,7),pathMat);
  cross.rotation.x=-Math.PI/2; cross.position.set(0,0.015,-8); scene.add(cross);
  // Trees with simple low-poly foliage.
  function tree(x,z,s=1){
    const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.35*s,.5*s,3*s,7),wood);
    trunk.position.set(x,1.5*s,z); trunk.castShadow=true; scene.add(trunk);
    for(let i=0;i<3;i++){
      const crown=new THREE.Mesh(new THREE.IcosahedronGeometry((2.1-i*.25)*s,1),mat(i===1?0x3d6544:0x4e7a4d));
      crown.position.set(x,(3.3+i*1.15)*s,z); crown.castShadow=true; scene.add(crown);
    }
  }
  for(const p of [[-14,5],[-19,12],[14,5],[19,12],[-40,-5],[40,-5],[-42,18],[42,18],[-12,26],[12,26]]) tree(p[0],p[1],0.9+Math.random()*0.35);
  // Decorative lanterns.
  for(const x of [-5,5]){
    box(.22,3.2,.22,dark,x,1.6,2);
    const lamp=new THREE.Mesh(new THREE.SphereGeometry(.42,10,8),new THREE.MeshStandardMaterial({color:0xffd58b,emissive:0xffa52b,emissiveIntensity:1.1}));
    lamp.position.set(x,3.45,2); scene.add(lamp);
  }

  // Player character: simple stylized student model built from primitives.
  const player=new THREE.Group(); scene.add(player); player.position.set(0,0,16);
  const robe=new THREE.Mesh(new THREE.CapsuleGeometry(.62,1.15,4,8),mat(0x3c315f));
  robe.position.y=1.2; robe.castShadow=true; player.add(robe);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.42,16,12),mat(0xe0b58c));
  head.position.y=2.35; head.castShadow=true; player.add(head);
  const hair=new THREE.Mesh(new THREE.SphereGeometry(.44,12,8,0,Math.PI*2,0,Math.PI*.55),mat(0x38261e));
  hair.position.y=2.52; player.add(hair);
  const scarf=new THREE.Mesh(new THREE.BoxGeometry(.24,.85,.18),gold);
  scarf.position.set(0,1.65,-.48); player.add(scarf);
  const legs=[];
  for(const x of [-.27,.27]){
    const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.19,.55,3,6),dark);
    leg.position.set(x,.45,0); leg.castShadow=true; player.add(leg); legs.push(leg);
  }

  const keys={};
  addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();});
  addEventListener('keyup',e=>keys[e.code]=false);
  let joyX=0,joyY=0,jumping=false,velocityY=0;
  const joy=document.getElementById('joystick'), stick=document.getElementById('stick');
  let joyPointer=null;
  function setJoy(e){
    const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    let dx=e.clientX-cx,dy=e.clientY-cy,limit=r.width*.34;
    const len=Math.hypot(dx,dy); if(len>limit){dx=dx/len*limit;dy=dy/len*limit;}
    joyX=dx/limit;joyY=dy/limit;
    stick.style.left='calc(50% + '+dx+'px)';stick.style.top='calc(50% + '+dy+'px)';
  }
  joy.addEventListener('pointerdown',e=>{joyPointer=e.pointerId;joy.setPointerCapture(e.pointerId);setJoy(e);});
  joy.addEventListener('pointermove',e=>{if(e.pointerId===joyPointer)setJoy(e);});
  function resetJoy(){joyPointer=null;joyX=0;joyY=0;stick.style.left='50%';stick.style.top='50%';}
  joy.addEventListener('pointerup',resetJoy);joy.addEventListener('pointercancel',resetJoy);
  function jump(){if(player.position.y<=0.01){velocityY=8.5;jumping=true;}}
  document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump();});
  addEventListener('keydown',e=>{if(e.code==='Space')jump();});

  const clock=new THREE.Clock();
  const camOffset=new THREE.Vector3(0,7.5,12.5);
  camera.position.set(0,8,28); camera.lookAt(0,1,10);
  let elapsed=0;
  function animate(){
    requestAnimationFrame(animate);
    const dt=Math.min(clock.getDelta(),0.04); elapsed+=dt;
    let x=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+joyX;
    let z=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0)+joyY;
    const mag=Math.hypot(x,z); if(mag>1){x/=mag;z/=mag;}
    const moving=mag>0.08, speed=(keys.ShiftLeft?8:5.2);
    player.position.x+=x*speed*dt;
    player.position.z+=z*speed*dt;
    player.position.x=THREE.MathUtils.clamp(player.position.x,-48,48);
    player.position.z=THREE.MathUtils.clamp(player.position.z,-48,42);
    if(moving)player.rotation.y=Math.atan2(x,z);
    velocityY-=22*dt;player.position.y+=velocityY*dt;
    if(player.position.y<0){player.position.y=0;velocityY=0;jumping=false;}
    const target=new THREE.Vector3(player.position.x,player.position.y+2.1,player.position.z);
    const desired=new THREE.Vector3(player.position.x+camOffset.x,player.position.y+camOffset.y,player.position.z+camOffset.z);
    camera.position.lerp(desired,1-Math.exp(-4*dt));camera.lookAt(target);
    if(moving){legs[0].rotation.x=Math.sin(elapsed*10)*.55;legs[1].rotation.x=-Math.sin(elapsed*10)*.55;}
    else{legs[0].rotation.x=0;legs[1].rotation.x=0;}
    status.textContent='Explore the academy  ·  '+Math.round(player.position.x)+', '+Math.round(player.position.z);
    renderer.render(scene,camera);
  }
  addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
  status.textContent='World ready · WASD / Joystick · Space / Jump';
  animate();
} catch(err) {
  document.getElementById('error').style.display='block';
  document.getElementById('errorText').textContent=String(err);
  console.error(err);
}
</script>
</body>
</html>
