<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#10152e">
<title>Pixel Quest 3D — Sky Islands</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10152e;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}
#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
#top{position:fixed;z-index:3;top:env(safe-area-inset-top,10px);left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:12px;pointer-events:none;gap:8px}
.brand,.stats,.actions{pointer-events:auto;background:#10152ed9;border:1px solid #ffffff28;backdrop-filter:blur(12px);border-radius:16px;padding:9px 12px;box-shadow:0 8px 28px #0003}
.brand{font-weight:900;color:#d9ccff;font-size:15px}.stats{display:flex;gap:12px;font-size:13px;font-weight:800;color:#ffe58a}.actions{display:flex;gap:7px}
button{font:inherit;color:white;border:1px solid #ffffff40;background:#5545b8;border-radius:11px;padding:8px 11px;font-weight:800}
#message{position:fixed;z-index:4;left:50%;top:24%;transform:translateX(-50%);width:min(90%,420px);text-align:center;background:#11172be8;border:1px solid #ffffff38;border-radius:20px;padding:22px;box-shadow:0 15px 50px #0007}
#message h1{margin:0 0 8px;font-size:clamp(25px,6vw,38px);color:#ffe58a}#message p{margin:6px 0 16px;color:#d9defb;font-size:14px}#message button{padding:12px 22px;background:#7659ed}
#hint{position:fixed;z-index:2;bottom:105px;left:50%;transform:translateX(-50%);font-size:12px;color:#fff;background:#11172ba8;padding:7px 12px;border-radius:20px;white-space:nowrap}
#controls{position:fixed;z-index:3;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 18px;pointer-events:none}
.pad{display:flex;gap:10px;pointer-events:auto}.control{width:62px;height:62px;border-radius:20px;background:#292b57dc;border:1px solid #b8adff88;font-size:24px;box-shadow:0 5px 0 #171735;touch-action:none;user-select:none}
#jump{width:82px;height:72px;border-radius:24px;background:#704ee5;font-size:14px}
#bossbar{position:fixed;z-index:3;top:75px;left:50%;transform:translateX(-50%);width:min(220px,55vw);height:9px;background:#25172b;border:1px solid #ffffff55;border-radius:20px;overflow:hidden;display:none}
#bossfill{height:100%;width:100%;background:linear-gradient(90deg,#ff477e,#ffbf5e)}
@media(min-width:800px){#controls{max-width:760px;left:50%;transform:translateX(-50%)}#hint{bottom:24px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="top"><div class="brand">🌤️ PIXEL QUEST 3D</div><div class="stats"><span id="level">LEVEL 1</span><span id="coins">🪙 0</span><span id="lives">❤️ 3</span></div><div class="actions"><button id="sound">♫</button><button id="restart">↻</button></div></div>
<div id="bossbar"><div id="bossfill"></div></div>
<div id="message"><h1>SKY ISLANDS</h1><p>A 3D platform adventure. Collect coins, jump over enemies and reach the portal!</p><button id="start">START ADVENTURE</button></div>
<div id="hint">Move: ◀ ▶ / A D · Jump: Space / ↑</div>
<div id="controls"><div class="pad"><button class="control" data-key="left">◀</button><button class="control" data-key="right">▶</button></div><button class="control" id="jump" data-key="jump">JUMP</button></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const mount=document.querySelector('#game');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x83d7ff);scene.fog=new THREE.Fog(0x83d7ff,35,100);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,180);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;mount.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdff6ff,0x5a7046,2.1));
const sun=new THREE.DirectionalLight(0xfff2d2,2.4);sun.position.set(-12,24,14);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-35;sun.shadow.camera.right=35;sun.shadow.camera.top=35;sun.shadow.camera.bottom=-35;scene.add(sun);
const mats={grass:new THREE.MeshStandardMaterial({color:0x55c96d,roughness:.9}),soil:new THREE.MeshStandardMaterial({color:0x8a563b,roughness:1}),stone:new THREE.MeshStandardMaterial({color:0x8e9bb0,roughness:.9}),gold:new THREE.MeshStandardMaterial({color:0xffd23f,metalness:.55,roughness:.25}),red:new THREE.MeshStandardMaterial({color:0xe94e68}),skin:new THREE.MeshStandardMaterial({color:0xffc59b}),blue:new THREE.MeshStandardMaterial({color:0x334eaa}),white:new THREE.MeshStandardMaterial({color:0xffffff}),dark:new THREE.MeshStandardMaterial({color:0x25233e}),enemy:new THREE.MeshStandardMaterial({color:0x9854c7}),boss:new THREE.MeshStandardMaterial({color:0x8d294c})};
const boxGeo=new THREE.BoxGeometry(1,1,1);
function box(parent,x,y,z,sx,sy,sz,mat){const m=new THREE.Mesh(boxGeo,mat);m.position.set(x,y,z);m.scale.set(sx,sy,sz);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
let player,platforms=[],coins=[],enemies=[],portal,boss=null,levelNo=1,score=0,lives=3,playing=false,gameOver=false,win=false,vy=0,onGround=false,inv=0,jumpBuffer=0,keys={left:false,right:false,jump:false},soundOn=true,audioCtx;
const $=id=>document.getElementById(id);
function beep(f=500){if(!soundOn)return;try{audioCtx=audioCtx||new AudioContext();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=f;g.gain.value=.045;g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.12);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.12)}catch{}}
function makeHero(){const g=new THREE.Group();box(g,0,.62,0,.72,1.05,.58,mats.red);box(g,0,1.38,0,.7,.65,.62,mats.skin);box(g,0,1.72,-.02,.82,.22,.72,mats.red);box(g,-.19,1.42,-.31,.09,.12,.05,mats.dark);box(g,.19,1.42,-.31,.09,.12,.05,mats.dark);box(g,0,1.12,-.34,.28,.07,.04,mats.dark);box(g,-.2,.08,0,.25,.2,.4,mats.blue);box(g,.2,.08,0,.25,.2,.4,mats.blue);return g}
function platform(x,z,w=7,d=6,top=0){box(scene,x,top-.48,z,w,.96,d,mats.soil);box(scene,x,top+.015,z,w,.12,d,mats.grass);platforms.push({x,z,w,d,top})}
function addCoin(x,y,z){const mesh=new THREE.Mesh(new THREE.TorusGeometry(.34,.12,8,18),mats.gold);mesh.position.set(x,y,z);mesh.rotation.y=Math.PI/2;mesh.castShadow=true;scene.add(mesh);coins.push({mesh,got:false})}
function addEnemy(x,z){const g=new THREE.Group();box(g,0,.42,0,.9,.8,.8,mats.enemy);box(g,-.2,.55,-.42,.12,.16,.06,mats.white);box(g,.2,.55,-.42,.12,.16,.06,mats.white);box(g,0,.12,0,.95,.12,.85,mats.dark);g.position.set(x,0,z);scene.add(g);enemies.push({mesh:g,x,z,dir:1,alive:true,home:x,range:2.1})}
function clearWorld(){for(const obj of [...platforms.map(()=>null)]){};while(scene.children.length>2){const o=scene.children[scene.children.length-1];if(o===sun)break;scene.remove(o)}platforms=[];coins=[];enemies=[];boss=null;portal=null}
function buildLevel(n){
clearWorld();levelNo=n;const base=n===1?0:0;const count=n===1?9:11;
for(let i=0;i<count;i++){const x=i*7;const z=(i%3-1)*1.6;platform(x,z, i===0?8:6.5,6, i%4===2?.6:0);if(i>0&&i<count-1){addCoin(x,1.8,z-.4);addCoin(x+1.1,1.8,z+.5)}if(i===2||i===5||i===7)addEnemy(x,z)}
platform(count*7,0,7,7,0);
if(n===2){for(let i=0;i<3;i++)addCoin(58+i*1.1,1.8,(i-1)*.7);const g=new THREE.Group();box(g,0,.95,0,1.8,1.9,1.7,mats.boss);box(g,-.45,1.25,-.88,.25,.28,.08,mats.gold);box(g,.45,1.25,-.88,.25,.28,.08,mats.gold);box(g,0,.42,-.9,.75,.15,.08,mats.dark);g.position.set(68,0,0);scene.add(g);boss={mesh:g,hp:3,dir:1}}
const ring=new THREE.Mesh(new THREE.TorusGeometry(1.05,.18,12,32),new THREE.MeshStandardMaterial({color:0x8d68ff,emissive:0x4422bb,emissiveIntensity:1.3}));ring.position.set(count*7+1.4,1.5,0);scene.add(ring);const orb=new THREE.Mesh(new THREE.SphereGeometry(.75,16,16),new THREE.MeshBasicMaterial({color:0xc9aaff}));orb.position.copy(ring.position);scene.add(orb);portal={ring,orb,x:count*7+1.4};
if(player)scene.remove(player);player=makeHero();scene.add(player);player.position.set(0,0,0);vy=0;inv=0;gameOver=false;win=false;updateHud();$('bossbar').style.display=boss?'block':'none';
}
function updateHud(){$('level').textContent='LEVEL '+levelNo;$('coins').textContent='🪙 '+score;$('lives').textContent='❤️ '+lives;if(boss)$('bossfill').style.width=(boss.hp/3*100)+'%'}
function restart(){score=0;lives=3;buildLevel(1);playing=true;$('message').style.display='none'}
function showMessage(title,desc,button){$('message').style.display='block';$('message').querySelector('h1').textContent=title;$('message').querySelector('p').textContent=desc;$('start').textContent=button}
function hit(){if(inv>0)return;lives--;inv=1.4;vy=5;beep(160);updateHud();if(lives<=0){gameOver=true;playing=false;showMessage('GAME OVER','Your adventure is not over. Try again!','TRY AGAIN')}}
function update(dt,t){
if(!playing)return;
const oldY=player.position.y;const speed=8;
let move=(keys.right?1:0)-(keys.left?1:0);player.position.x+=move*speed*dt;if(move)player.rotation.y=move>0?Math.PI:0;
jumpBuffer=Math.max(0,jumpBuffer-dt);vy-=22*dt;player.position.y+=vy*dt;onGround=false;
for(const p of platforms){const within=Math.abs(player.position.x-p.x)<p.w/2+.25&&Math.abs(player.position.z-p.z)<p.d/2+.25;const feet=player.position.y;if(within&&vy<=0&&oldY>=p.top-.02&&feet<=p.top+.15){player.position.y=p.top;vy=0;onGround=true}}
if(jumpBuffer>0&&onGround){vy=12.5;onGround=false;jumpBuffer=0;beep(620)}
player.position.z=THREE.MathUtils.clamp(player.position.z,-3.5,3.5);
for(const c of coins){if(!c.got){c.mesh.rotation.y+=dt*2.5;if(c.mesh.position.distanceTo(new THREE.Vector3(player.position.x,player.position.y+.9,player.position.z))<1.15){c.got=true;scene.remove(c.mesh);score++;beep(900);updateHud()}}}
for(const e of enemies){if(!e.alive)continue;e.x+=e.dir*dt*1.7;if(Math.abs(e.x-e.home)>e.range)e.dir*=-1;e.mesh.position.x=e.x;if(Math.abs(player.position.x-e.x)<.85&&Math.abs(player.position.z-e.z)<.9&&player.position.y<1.3){if(vy<0&&player.position.y>.45){e.alive=false;scene.remove(e.mesh);vy=8;score+=2;beep(300);updateHud()}else hit()}}
if(boss){boss.mesh.position.x+=boss.dir*dt*1.2;if(boss.mesh.position.x>70||boss.mesh.position.x<66)boss.dir*=-1;if(Math.abs(player.position.x-boss.mesh.position.x)<1.25&&Math.abs(player.position.z)<1.2&&player.position.y<2.1){if(vy<0&&player.position.y>1.1){boss.hp--;vy=10;beep(220);updateHud();if(boss.hp<=0){scene.remove(boss.mesh);boss=null;$('bossbar').style.display='none';score+=15;updateHud()}}else hit()}}
if(player.position.y< -8){hit();player.position.set(Math.max(0,player.position.x-4),3,0);vy=0;jumpBuffer=0}
if(portal){portal.ring.rotation.y+=dt;portal.orb.rotation.y-=dt;if(player.position.x>portal.x-.6&&Math.abs(player.position.z)<2&&(!boss)){if(levelNo===1){score+=5;buildLevel(2);beep(750)}else{playing=false;win=true;showMessage('YOU DID IT!','You conquered the Sky Islands! Total coins: '+score,'PLAY AGAIN')}}}
if(inv>0){inv-=dt;player.visible=Math.floor(t*10)%2===0}
const target=new THREE.Vector3(player.position.x-1.5,player.position.y+4.6,player.position.z+10.5);camera.position.lerp(target,1-Math.pow(.001,dt));camera.lookAt(player.position.x,player.position.y+1,player.position.z);
}
let last=0;function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000||0,.033);last=now;update(dt,now/1000);renderer.render(scene,camera)}
function press(k,v){keys[k]=v}
document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' ','a','d','A','D'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')press('left',true);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')press('right',true);if(e.key===' '||e.key==='ArrowUp'){press('jump',true);jumpBuffer=0.28}});
document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')press('left',false);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')press('right',false);if(e.key===' '||e.key==='ArrowUp')press('jump',false)});
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;const down=e=>{e.preventDefault();press(k,true);if(k==='jump')jumpBuffer=0.28;b.setPointerCapture?.(e.pointerId)};const up=e=>{e.preventDefault();press(k,false)};b.addEventListener('pointerdown',down);['pointerup','pointercancel','lostpointercapture','pointerleave'].forEach(ev=>b.addEventListener(ev,up))});
$('start').onclick=restart;$('restart').onclick=()=>{restart();showMessage('SKY ISLANDS','Tap start to begin your 3D adventure.','START ADVENTURE')};$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'♫':'×';if(soundOn)beep(600)};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.6))});
buildLevel(1);camera.position.set(-2,5,11);camera.lookAt(0,1,0);loop(0);
</script>
</body></html>
