<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pixel Quest — Adventure</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1022;color:#fff;font-family:system-ui,Arial;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:12px}
main{width:min(100%,960px)}header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}h1{font-size:clamp(21px,4vw,30px);margin:0;color:#c5aaff}#hud{font-weight:800;color:#ffe58a;display:flex;gap:12px;flex-wrap:wrap;font-size:14px}
#frame{border:3px solid #7661ee;border-radius:14px;overflow:hidden;box-shadow:0 12px 40px #0009;background:#82d9ff}canvas{display:block;width:100%;height:auto;touch-action:none}
#hint{text-align:center;color:#c3c8e4;font-size:13px;margin:9px 0}.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:580px;margin:10px auto}.pad{display:flex;gap:10px}
.ctrl,button.action{border:1px solid #9385ff;border-radius:15px;background:#29264f;color:white;font-weight:800;touch-action:none;box-shadow:0 4px 0 #17142f}
.ctrl{width:66px;height:58px;font-size:24px}#jump{width:92px;background:#654de0}button.action{padding:9px 13px;font-size:13px;touch-action:manipulation}button:active{transform:translateY(2px);box-shadow:0 2px 0 #17142f}
@media(max-width:520px){body{padding:8px}#hud{font-size:12px;gap:7px}.ctrl{width:60px;height:54px}}
</style>
</head>
<body><main>
<header><h1>🌟 Pixel Quest</h1><div id="hud"><span id="levelHud">Level 1</span><span id="coinHud">🪙 0</span><span id="lifeHud">❤️ 3</span></div><div><button class="action" id="sound">🔊 Sound</button> <button class="action" id="restart">↻ Restart</button></div></header>
<div id="frame"><canvas id="game" width="800" height="450" aria-label="Pixel Quest platform adventure"></canvas></div>
<p id="hint">Move: ← → or A / D · Jump: Space / ↑ · Collect coins, stomp enemies and reach the portal!</p>
<div class="controls"><div class="pad"><button class="ctrl" data-key="left">◀</button><button class="ctrl" data-key="right">▶</button></div><button class="ctrl" id="jump" data-key="jump">JUMP</button></div>
</main>
<script>
(()=>{
const c=document.getElementById('game'),ctx=c.getContext('2d'),W=800,H=450;
const keys={left:false,right:false,jump:false};let player,coins,enemies,platforms,camera,score,lives,levelNo,won,dead,flag,boss,soundOn=true,audio;
const $=id=>document.getElementById(id);
function beep(freq=440,duration=.08,type='square'){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.07,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch(e){}}
function buildLevel(n){
levelNo=n;won=false;dead=false;camera=0;player={x:45,y:330,vx:0,vy:0,w:30,h:42,on:false,inv:0,face:1};
if(n===1){
const world=2200;platforms=[{x:0,y:400,w:world,h:50},{x:220,y:330,w:145,h:18},{x:465,y:280,w:145,h:18},{x:710,y:345,w:160,h:18},{x:980,y:295,w:150,h:18},{x:1230,y:340,w:165,h:18},{x:1510,y:280,w:150,h:18},{x:1770,y:330,w:175,h:18}];
coins=[];[260,310,500,550,755,810,1020,1070,1280,1340,1550,1600,1810,1880,2040].forEach((x,i)=>coins.push({x,y:[285,285,235,235,300,300,245,245,295,295,235,235,285,285,350][i],got:false}));
enemies=[{x:570,y:370,v:1.2,home:520,end:640,alive:true},{x:1080,y:265,v:1.3,home:1020,end:1140,alive:true},{x:1630,y:370,v:1.5,home:1570,end:1700,alive:true}];flag=2100;boss=null;
}else{
const world=2500;platforms=[{x:0,y:400,w:world,h:50},{x:180,y:335,w:130,h:18},{x:390,y:285,w:135,h:18},{x:650,y:340,w:150,h:18},{x:900,y:285,w:145,h:18},{x:1160,y:335,w:150,h:18},{x:1410,y:275,w:150,h:18},{x:1680,y:335,w:150,h:18},{x:1940,y:290,w:160,h:18}];
coins=[];[220,265,430,480,690,750,950,1000,1200,1260,1450,1510,1730,1790,1990,2050,2200,2280].forEach((x,i)=>coins.push({x,y:[290,290,240,240,295,295,235,235,290,290,225,225,290,290,240,240,345,345][i],got:false}));
enemies=[{x:470,y:370,v:1.5,home:420,end:570,alive:true},{x:980,y:370,v:1.7,home:920,end:1080,alive:true},{x:1740,y:370,v:1.8,home:1680,end:1850,alive:true}];
boss={x:2240,y:330,w:64,h:70,hp:3,maxHp:3,v:1.2,hitFlash:0};flag=2420;
}
$('levelHud').textContent='🗺️ Level '+n;$('coinHud').textContent='🪙 '+score;$('lifeHud').textContent='❤️ '+lives;
}
function reset(){score=0;lives=3;buildLevel(1);draw()}
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function draw(){
let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,levelNo===1?'#65cfff':'#4d397e');sky.addColorStop(1,levelNo===1?'#e3faff':'#f6a6bb');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
ctx.save();ctx.translate(-camera,0);
for(let i=0;i<14;i++){let x=i*210;rect(x,85,90,28,'#ffffff40');rect(x+25,65,100,34,'#ffffff40');rect(x+45,95,75,20,'#ffffff40')}
for(let p of platforms){rect(p.x,p.y,p.w,p.h,'#75452c');rect(p.x,p.y,p.w,8,levelNo===1?'#40bd61':'#bd5a73');for(let x=p.x+12;x<p.x+p.w-8;x+=28)rect(x,p.y+15,12,8,'#a96b39')}
for(let q of coins)if(!q.got){ctx.fillStyle='#ffda36';ctx.beginPath();ctx.ellipse(q.x,q.y,8,12,0,0,Math.PI*2);ctx.fill();rect(q.x-2,q.y-7,3,13,'#fff5a5')}
for(let e of enemies)if(e.alive){rect(e.x,e.y,30,27,'#9b4cba');rect(e.x+5,e.y+7,6,6,'white');rect(e.x+19,e.y+7,6,6,'white');rect(e.x+7,e.y+20,17,4,'#4a245f')}
if(boss){rect(boss.x,boss.y,boss.w,boss.h,boss.hitFlash?'#fff':'#7b243f');rect(boss.x+9,boss.y+16,12,12,'#ffdf4e');rect(boss.x+43,boss.y+16,12,12,'#ffdf4e');rect(boss.x+15,boss.y+48,35,8,'#260e24');rect(boss.x+7,boss.y-15,50,7,'#321528');rect(boss.x+7,boss.y-15,50*boss.hp/boss.maxHp,7,'#ff4e6a')}
rect(flag,255,7,145,'#5941b5');rect(flag+7,255,5,145,'#fff');rect(flag+12,255,40,24,levelNo===1?'#ffe15b':'#ff729c');
if(!(player.inv>0&&Math.floor(Date.now()/90)%2===0)){rect(player.x,player.y+9,player.w,player.h-9,'#e84d65');rect(player.x+3,player.y,24,17,'#ffd1a5');rect(player.x+2,player.y,26,7,'#54306e');rect(player.x+7,player.y+16,5,5,'#222');rect(player.x+19,player.y+16,5,5,'#222');rect(player.x+2,player.y+34,11,8,'#263b79');rect(player.x+18,player.y+34,11,8,'#263b79')}
ctx.restore();
if(boss){ctx.fillStyle='#fff';ctx.font='bold 13px system-ui';ctx.fillText('BOSS HP',W-100,22)}
if(won||dead){rect(0,0,W,H,'#101426bb');ctx.fillStyle='white';ctx.textAlign='center';ctx.font='bold 36px system-ui';ctx.fillText(won?(levelNo===1?'LEVEL 1 CLEAR!':'YOU SAVED THE KINGDOM!'):'GAME OVER',W/2,H/2);ctx.font='17px system-ui';ctx.fillText(won?(levelNo===1?'Next level unlocked!':'All levels completed!'):'Tap Restart to try again',W/2,H/2+36);ctx.textAlign='left'}
$('coinHud').textContent='🪙 '+score;$('lifeHud').textContent='❤️ '+lives;
}
function hurt(){if(player.inv>0)return;lives--;player.inv=100;player.vy=-6;beep(150,.18,'sawtooth');if(lives<=0)dead=true}
function update(){
if(!won&&!dead){
player.vx=(keys.right?3.5:0)-(keys.left?3.5:0);if(player.vx)player.face=Math.sign(player.vx);player.x=Math.max(0,Math.min((levelNo===1?2200:2500)-player.w,player.x+player.vx));
player.vy=Math.min(13,player.vy+.55);player.y+=player.vy;player.on=false;
for(const p of platforms)if(player.x+player.w>p.x&&player.x<p.x+p.w&&player.y+player.h>=p.y&&player.y+player.h<=p.y+Math.max(18,player.vy+2)&&player.vy>=0){player.y=p.y-player.h;player.vy=0;player.on=true}
if(keys.jump&&player.on){player.vy=-11.5;player.on=false;beep(520,.07)}
for(const q of coins)if(!q.got&&Math.abs(player.x+15-q.x)<23&&Math.abs(player.y+20-q.y)<28){q.got=true;score++;beep(850,.07,'sine')}
for(const e of enemies)if(e.alive){e.x+=e.v;if(e.x<e.home||e.x>e.end)e.v*=-1;if(player.x+player.w>e.x&&player.x<e.x+30&&player.y+player.h>e.y&&player.y+player.h<e.y+25&&player.vy>0){e.alive=false;player.vy=-7;score+=2;beep(260,.1)}else if(player.x+player.w>e.x&&player.x<e.x+30&&player.y+player.h>e.y&&player.y<e.y+27)hurt()}
if(boss){boss.x+=boss.v;if(boss.x<2200||boss.x>2370)boss.v*=-1;if(player.x+player.w>boss.x&&player.x<boss.x+boss.w&&player.y+player.h>boss.y&&player.y+player.h<boss.y+22&&player.vy>0){boss.hp--;boss.hitFlash=8;player.vy=-10;score+=5;beep(190,.2,'sawtooth');if(boss.hp<=0){boss=null;score+=20;beep(900,.3,'sine')}}else if(player.x+player.w>boss.x&&player.x<boss.x+boss.w&&player.y+player.h>boss.y&&player.y<boss.y+boss.h)hurt();if(boss&&boss.hitFlash>0)boss.hitFlash--}
if(player.y>H+70){hurt();if(!dead){player.x=Math.max(20,player.x-110);player.y=250;player.vy=0}}
if(player.inv>0)player.inv--;
if(player.x>flag-12){if(levelNo===1){beep(700,.2);buildLevel(2)}else{won=true;beep(950,.4,'sine')}}
camera=Math.max(0,Math.min((levelNo===1?2200:2500)-W,player.x-W*.38));
}
draw();requestAnimationFrame(update)
}
document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' ','a','d','A','D'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.left=true;if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=true;if(e.key===' '||e.key==='ArrowUp')keys.jump=true});
document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.left=false;if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=false;if(e.key===' '||e.key==='ArrowUp')keys.jump=false});
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;const on=e=>{e.preventDefault();keys[k]=true;try{b.setPointerCapture(e.pointerId)}catch(_){}};const off=e=>{e.preventDefault();keys[k]=false};b.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel','lostpointercapture'].forEach(t=>b.addEventListener(t,off))});
$('restart').onclick=reset;$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 Sound':'🔇 Muted';if(soundOn)beep(600,.08)};
reset();update();
})();
</script></body></html>
