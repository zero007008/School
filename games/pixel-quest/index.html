<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10152e"><title>Pixel Quest 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#86d9ff;color:#fff;font-family:system-ui,sans-serif;touch-action:none}#game{position:fixed;inset:0}canvas{display:block}
#hud{position:fixed;z-index:4;top:env(safe-area-inset-top,8px);left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px;gap:6px;pointer-events:none}.pill{background:#10152edb;border:1px solid #ffffff40;border-radius:14px;padding:8px 11px;font-weight:900;font-size:13px;box-shadow:0 5px 18px #0003}.gold{color:#ffe17a}
#message{position:fixed;z-index:8;inset:0;display:grid;place-items:center;background:#08102a66;padding:22px}.panel{width:min(90vw,390px);text-align:center;padding:25px 20px;border:1px solid #ffffff55;border-radius:25px;background:#111a35ed;box-shadow:0 20px 60px #0006}.panel h1{margin:0 0 8px;color:#ffe17a;font-size:32px}.panel p{color:#e0e8ff;font-size:14px;line-height:1.5}.panel button{background:#7657f3;border:0;border-radius:14px;padding:13px 22px;color:white;font-weight:900;font-size:15px}
#controls{position:fixed;z-index:5;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 15px;pointer-events:none}.pad{display:grid;grid-template-columns:55px 55px 55px;grid-template-rows:55px 55px;gap:5px;pointer-events:auto}.ctrl{border:1px solid #ffffff70;background:#202b59dd;color:white;border-radius:17px;font-size:21px;font-weight:900;box-shadow:0 5px 0 #111735;touch-action:none;user-select:none}.up{grid-column:2;grid-row:1}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}#jump{pointer-events:auto;width:83px;height:76px;border:1px solid #ffffff88;border-radius:25px;background:#7651e9;color:#fff;font-weight:1000;font-size:15px;box-shadow:0 6px 0 #39227f;touch-action:none}
#tip{position:fixed;z-index:3;bottom:150px;left:50%;transform:translateX(-50%);background:#10152dbb;padding:6px 12px;border-radius:20px;font-size:11px;white-space:nowrap}
@media(min-width:800px){#controls{max-width:700px;left:50%;transform:translateX(-50%)}#tip{bottom:20px}}
</style></head><body><div id="game"></div>
<div id="hud"><div class="pill">🍄 PIXEL QUEST 3D</div><div class="pill gold" id="level">WORLD 1</div><div class="pill gold" id="coins">🪙 0</div><div class="pill" id="lives">❤️ 3</div><button class="pill" id="restart" style="pointer-events:auto;color:white">↻</button></div>
<div id="tip">Move: D-pad / WASD · Jump: Space</div>
<div id="controls"><div class="pad"><button class="ctrl up" data-k="forward">▲</button><button class="ctrl left" data-k="left">◀</button><button class="ctrl down" data-k="back">▼</button><button class="ctrl right" data-k="right">▶</button></div><button id="jump" data-k="jump">JUMP</button></div>
<div id="message"><div class="panel"><h1>SUPER SKY QUEST</h1><p>Explore a 3D world, jump across floating islands, collect coins and stomp the monsters!</p><button id="start">START GAME</button></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const root=document.querySelector('#game'),scene=new THREE.Scene();scene.background=new THREE.Color(0x8bdcff);scene.fog=new THREE.Fog(0x8bdcff,35,95);
const camera=new THREE.PerspectiveCamera( sixty(),innerWidth/innerHeight,.1,180);function sixty(){return 62}
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe6f8ff,0x64734a,2.2));const sun=new THREE.DirectionalLight(0xfff1cf,2.5);sun.position.set(-15,25,15);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-35;sun.shadow.camera.right=35;sun.shadow.camera.top=35;sun.shadow.camera.bottom=-35;scene.add(sun);
const world=new THREE.Group();scene.add(world);
const mat=(c,rough=.85,metal=0)=>new THREE.MeshStandardMaterial({color:c,roughness:rough,metalness:metal});
const M={grass:mat(0x54c96d),earth:mat(0x986044),rock:mat(0x8395b3),gold:mat(0xffd13c,.25,.55),red:mat(0xe94355),blue:mat(0x3154bd),skin:mat(0xffc79e),white:mat(0xffffff),black:mat(0x25243c),green:mat(0x34a866),enemy:mat(0x9a54c8),boss:mat(0x982e50),pipe:mat(0x159b61)};
const cube=new THREE.BoxGeometry(1,1,1),sphere=new THREE.SphereGeometry(1,16,12);
function block(parent,x,y,z,w,h,d,m){const o=new THREE.Mesh(cube,m);o.position.set(x,y,z);o.scale.set(w,h,d);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
let platforms=[],coins=[],foes=[],goal=null,hero=null,score=0,lives=3,worldNo=1,active=false,dead=false,won=false,vy=0,ground=false,buffer=0,inv=0;const input={left:false,right:false,forward:false,back:false};let audio;
function sound(freq=600){try{audio=audio||new AudioContext();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;g.gain.value=.04;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.13);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.13)}catch{}}
function clearWorld(){while(world.children.length)world.remove(world.children[0]);platforms=[];coins=[];foes=[];goal=null}
function platform(x,z,w=5,d=5,y=0){block(world,x,y-.45,z,w,.9,d,M.earth);block(world,x,y+.02,z,w,.14,d,M.grass);platforms.push({x,z,w,d,y})}
function coin(x,y,z){const g=new THREE.Mesh(new THREE.TorusGeometry(.35,.12,10,20),M.gold);g.position.set(x,y,z);g.castShadow=true;world.add(g);coins.push({mesh:g,got:false})}
function enemy(x,z){const g=new THREE.Group();block(g,0,.42,0,.85,.8,.8,M.enemy);block(g,-.2,.55,-.42,.12,.15,.05,M.white);block(g,.2,.55,-.42,.12,.15,.05,M.white);block(g,0,.1,0,.9,.15,.85,M.black);g.position.set(x,0,z);world.add(g);foes.push({mesh:g,x,z,homeX:x,homeZ:z,phase:Math.random()*6,alive:true})}
function makeHero(){const g=new THREE.Group();const body=new THREE.Group();g.add(body);const torso=block(body,0,.78,0,.66,.82,.48,M.red);const head=new THREE.Mesh(sphere,M.skin);head.position.set(0,1.43,0);head.scale.set(.43,.43,.4);head.castShadow=true;body.add(head);block(body,0,1.79,0,.86,.18,.68,M.red);block(body,-.2,1.48,-.36,.08,.12,.05,M.black);block(body,.2,1.48,-.36,.08,.12,.05,M.black);block(body,0,1.26,-.39,.22,.06,.04,M.black);const leg1=block(body,-.2,.25,0,.23,.5,.28,M.blue),leg2=block(body,.2,.25,0,.23,.5,.28,M.blue);const arm1=block(body,-.48,.8,0,.2,.55,.22,M.skin),arm2=block(body,.48,.8,0,.2,.55,.22,M.skin);return {group:g,body,leg1,leg2,arm1,arm2}}
function build(n){clearWorld();worldNo=n;
const path=n===1?[[0,0,0,8,8],[7,0,-2,5,5],[13,0,-5,5,5],[19,0,-2,5,5],[25,0,2,5,5],[31,0,5,5,5],[37,0,2,6,6],[44,0,-2,6,6],[51,0,-4,7,7]]:[[0,0,0,8,8],[7,0,3,5,5],[13,0,6,5,5],[19,0,2,5,5],[25,0,-3,5,5],[31,0,-6,5,5],[37,0,-2,6,6],[44,0,3,6,6],[51,0,0,8,8]];
path.forEach((p,i)=>{platform(p[0],p[2],p[3],p[4],p[1]);if(i>0&&i<path.length-1){coin(p[0],1.7,p[2]);coin(p[0]+.9,1.9,p[2]+.7)}if(i===2||i===5||i===7)enemy(p[0],p[2])});
for(let i=0;i<4;i++){const cloud=new THREE.Mesh(new THREE.SphereGeometry(1,12,10),new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:.7}));cloud.position.set(8+i*13,12+(i%2)*3,-13-(i%3)*4);cloud.scale.set(3,1,1.6);world.add(cloud)}
// Decorative mushrooms and pipes
for(const [x,z] of [[5,-2],[23,3],[42,-4]]){const pipe=new THREE.Group();block(pipe,0,.7,0,1,1.4,1,M.pipe);block(pipe,0,1.45,0,1.25,.22,1.25,M.green);pipe.position.set(x,0,z);world.add(pipe)}
if(n===2){const b=new THREE.Group();block(b,0,1,0,1.8,2,1.8,M.boss);block(b,-.4,1.35,-.93,.25,.25,.08,M.gold);block(b,.4,1.35,-.93,.25,.25,.08,M.gold);b.position.set(47,0,0);world.add(b);foes.push({mesh:b,x:47,z:0,homeX:47,homeZ:0,phase:0,alive:true,boss:true,hp:3})}
const end=new THREE.Group();const tor=new THREE.Mesh(new THREE.TorusGeometry(1,.16,12,28),new THREE.MeshStandardMaterial({color:0x9a6bff,emissive:0x4a20bb,emissiveIntensity:1.5}));tor.position.y=1.6;end.add(tor);const orb=new THREE.Mesh(sphere,new THREE.MeshBasicMaterial({color:0xd7baff}));orb.scale.setScalar(.62);orb.position.y=1.6;end.add(orb);end.position.set(53,0,-4);world.add(end);goal={mesh:end,x:53,z:-4};
if(hero)scene.remove(hero.group);hero=makeHero();scene.add(hero.group);hero.group.position.set(0,0,0);vy=0;buffer=0;inv=0;dead=false;won=false;updateHud();$('level').textContent='WORLD '+n}
function updateHud(){$('coins').textContent='🪙 '+score;$('lives').textContent='❤️ '+lives}
function start(){score=0;lives=3;build(1);active=true;$('message').style.display='none'}
function message(title,desc,btn){$('message').style.display='grid';$('message').querySelector('h1').textContent=title;$('message').querySelector('p').textContent=desc;$('start').textContent=btn}
function hurt(){if(inv>0)return;lives--;inv=1.5;vy=6;sound(170);updateHud();if(lives<=0){active=false;dead=true;message('GAME OVER','The islands are waiting for another try!','PLAY AGAIN')}}
function update(dt,t){if(!active)return;
const old=hero.group.position.clone(),p=hero.group.position;
let dx=(input.right?1:0)-(input.left?1:0),dz=(input.back?1:0)-(input.forward?1:0);const len=Math.hypot(dx,dz)||1;dx/=len;dz/=len;
p.x+=dx*7.2*dt;p.z+=dz*7.2*dt;if(dx||dz){hero.body.rotation.y=Math.atan2(dx,dz);const swing=Math.sin(t*13)*.45;hero.leg1.rotation.x=swing;hero.leg2.rotation.x=-swing;hero.arm1.rotation.x=-swing*.6;hero.arm2.rotation.x=swing*.6}else{hero.leg1.rotation.x=hero.leg2.rotation.x=hero.arm1.rotation.x=hero.arm2.rotation.x=0}
buffer=Math.max(0,buffer-dt);vy-=24*dt;p.y+=vy*dt;ground=false;
for(const q of platforms){const inside=Math.abs(p.x-q.x)<q.w/2-.2&&Math.abs(p.z-q.z)<q.d/2-.2;if(inside&&vy<=0&&old.y>=q.y-.04&&p.y<=q.y+.12){p.y=q.y;vy=0;ground=true}}
if(buffer>0&&ground){vy=12;ground=false;buffer=0;sound(650)}
for(const c of coins){if(c.got)continue;c.mesh.rotation.y+=dt*2.8;if(c.mesh.position.distanceTo(new THREE.Vector3(p.x,p.y+1,p.z))<1){c.got=true;world.remove(c.mesh);score++;sound(950);updateHud()}}
for(const e of foes){if(!e.alive)continue;const wave=Math.sin(t*1.5+e.phase);e.mesh.position.x=e.homeX+wave*(e.boss?1.7:1.1);e.mesh.position.z=e.homeZ+Math.cos(t*1.2+e.phase)*(e.boss?.8:.5);const d=Math.hypot(p.x-e.mesh.position.x,p.z-e.mesh.position.z);if(d<1.05&&p.y<e.mesh.position.y+1.5){if(vy<0&&p.y>.55){if(e.boss){e.hp--;if(e.hp<=0){e.alive=false;world.remove(e.mesh);score+=15}else{vy=10}}else{e.alive=false;world.remove(e.mesh);score+=2}vy=9;sound(320);updateHud()}else hurt()}}
if(p.y< -7){hurt();p.set(Math.max(0,p.x-2),3,0);vy=0;buffer=0}
goal.mesh.rotation.y+=dt*.5;if(Math.hypot(p.x-goal.x,p.z-goal.z)<1.5&&p.y<2){if(worldNo===1){score+=5;build(2);sound(780)}else{active=false;won=true;message('YOU WIN!','You cleared both 3D worlds! Coins: '+score,'PLAY AGAIN')}}
if(inv>0){inv-=dt;hero.group.visible=Math.floor(t*12)%2===0}
const desired=new THREE.Vector3(p.x+1.5,p.y+6.3,p.z+10.5);camera.position.lerp(desired,1-Math.pow(.001,dt));camera.lookAt(p.x,p.y+1,p.z);
}
function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-prev)/1000||0,.035);prev=now;update(dt,now/1000);renderer.render(scene,camera)}let prev=0;
function setKey(k,v){if(k==='jump'){if(v)buffer=.25;return}input[k]=v}
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowleft','arrowright','arrowup','arrowdown',' ','w','a','s','d'].includes(k))e.preventDefault();if(k==='arrowleft'||k==='a')setKey('left',true);if(k==='arrowright'||k==='d')setKey('right',true);if(k==='arrowup'||k==='w')setKey('forward',true);if(k==='arrowdown'||k==='s')setKey('back',true);if(k===' '||k==='z')setKey('jump',true)});
document.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')setKey('left',false);if(k==='arrowright'||k==='d')setKey('right',false);if(k==='arrowup'||k==='w')setKey('forward',false);if(k==='arrowdown'||k==='s')setKey('back',false)});
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;const down=e=>{e.preventDefault();setKey(k,true);b.setPointerCapture?.(e.pointerId)},up=e=>{e.preventDefault();setKey(k,false)};b.addEventListener('pointerdown',down);['pointerup','pointercancel','lostpointercapture','pointerleave'].forEach(v=>b.addEventListener(v,up))});
$('start').onclick=start;$('restart').onclick=start;addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5))});
build(1);camera.position.set(2,7,12);camera.lookAt(0,1,0);loop(0);
</script></body></html>
