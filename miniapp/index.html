<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111827">
<title>School Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,Arial,sans-serif;background:#111827;color:#f8fafc}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#34415a,#111827 58%);overflow:hidden}
header{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #ffffff20;background:#111827d9}
.brand{font-weight:900;letter-spacing:2px;color:#f5c84b}.pill{font-size:11px;color:#a7f3d0;border:1px solid #27765e;border-radius:20px;padding:6px 10px}
main{height:calc(100dvh - 62px);display:flex;flex-direction:column;padding:12px;gap:10px}
.intro{display:flex;align-items:center;justify-content:space-between;gap:12px}.intro h1{font-size:19px;margin:0 0 3px}.intro p{margin:0;color:#9ca3af;font-size:12px}
.launch{border:0;border-radius:12px;background:#f3c64e;color:#1f2937;font-weight:800;padding:11px 15px;white-space:nowrap}
.frame{flex:1;min-height:0;border:1px solid #ffffff26;border-radius:16px;overflow:hidden;background:#202938;box-shadow:0 18px 50px #0006}
iframe{width:100%;height:100%;border:0;background:#202938}
footer{text-align:center;font-size:10px;color:#94a3b8;padding:2px}
</style>
</head>
<body>
<header><div class="brand">SCHOOL</div><div class="pill">TELEGRAM MINI APP</div></header>
<main>
<section class="intro"><div><h1>Welcome to School</h1><p>Explore the 3D campus and move your character.</p></div><button class="launch" id="expand">⛶ Fullscreen</button></section>
<div class="frame"><iframe id="game" title="School 3D Game" src="/games/arcane-academy/" allow="fullscreen; autoplay"></iframe></div>
<footer>Made for Telegram · School Game</footer>
</main>
<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();tg.setHeaderColor("#111827");tg.setBackgroundColor("#111827");}
document.getElementById("expand").addEventListener("click",()=>{tg?.expand();document.getElementById("game").requestFullscreen?.();});
</script>
</body>
</html>
